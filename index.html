<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PILAS · Prototipo vertical</title>
  <meta name="description" content="Abre tus redes con intención y sal sin culpa." />

  <!-- Logo en la pestaña y vista previa del link (WhatsApp, Instagram, etc.) -->
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
  <meta property="og:title" content="PILAS" />
  <meta property="og:description" content="Abre tus redes con intención y sal sin culpa." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://pilas-prototipo.vercel.app/assets/brand/og.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Estilos offline: Tailwind ya compilado con los tokens PILAS (regenerar con tools/ → npm run build:css) -->
  <link rel="stylesheet" href="css/tailwind.css" />

  <!-- Desarrollo con internet: Play CDN genera al vuelo las clases nuevas que aún no estén en tailwind.css.
       Sin internet no carga y no pasa nada: queda tailwind.css. El config va DESPUÉS del CDN. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>

  <!-- Iconos: Lucide (copia local, funciona sin internet) -->
  <script src="js/vendor/lucide.min.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="phone" class="phone text-ink">
    <!-- Barra de estado simulada. Triple toque = activar/desactivar modo demo -->
    <header id="statusbar" class="h-11 shrink-0 px-lg flex items-center justify-between text-label text-ink select-none" data-action="statusbar">
      <span id="clock">9:41</span>
      <span id="demo-flag" class="text-caption text-ink-soft" hidden>modo demo</span>
      <span class="inline-flex gap-xs" aria-hidden="true"><i data-lucide="wifi" class="w-4 h-4"></i><i data-lucide="battery-medium" class="w-4 h-4"></i></span>
    </header>

    <!-- Cada pantalla es una <section>. js/app.js renderiza su contenido y muestra solo la activa. -->
    <section class="screen" data-screen="inicio"             aria-label="Hoy (entrada real de PILAS)"></section>
    <section class="screen" data-screen="home"               aria-label="Celular simulado (demo)" hidden></section>
    <section class="screen" data-screen="nota"               aria-label="Nota de un amigo" hidden></section>
    <section class="screen" data-screen="responder"          aria-label="Responder al amigo" hidden></section>
    <section class="screen" data-screen="alternativa"        aria-label="Otra opción" hidden></section>
    <section class="screen" data-screen="alternativa-hecha"  aria-label="Actividad elegida" hidden></section>
    <section class="screen" data-screen="entrando"           aria-label="Entrando" hidden></section>
    <section class="screen" data-screen="feed"               aria-label="Feed simulado" hidden></section>
    <section class="screen" data-screen="pasaste"            aria-label="Te pasaste" hidden></section>
    <section class="screen" data-screen="cierre"             aria-label="Mensaje de cierre" hidden></section>
    <section class="screen" data-screen="grupo"               aria-label="Tu grupo" hidden></section>
    <section class="screen" data-screen="descanso"           aria-label="Descanso" hidden></section>
    <section class="screen" data-screen="descanso-activo"    aria-label="Descanso activo" hidden></section>
    <section class="screen" data-screen="descanso-fin"       aria-label="Descanso fin" hidden></section>
    <section class="screen" data-screen="dejarmensaje"       aria-label="Dejarle algo a un amigo" hidden></section>
    <section class="screen" data-screen="yo"                 aria-label="Yo" hidden></section>

    <!-- Hoja inferior: avisos, check-in, salida y selectores. app.js rellena su contenido -->
    <div id="sheet-layer" class="absolute inset-0 z-20" hidden>
      <div class="sheet-backdrop" data-action="sheet-more"></div>
      <div class="sheet bg-surface rounded-t-sheet px-lg pt-lg pb-xl" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
    </div>
  </div>

  <!-- Se cargan en este orden y comparten el mismo ámbito (ver el mapa en js/app.js). El orden importa. -->
  <script src="js/data.js"></script>
  <script src="js/components/ui.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/timers.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/screens/flujo/home.js"></script>
  <script src="js/screens/flujo/nota.js"></script>
  <script src="js/screens/flujo/responder.js"></script>
  <script src="js/screens/flujo/alternativa.js"></script>
  <script src="js/screens/flujo/alternativa-hecha.js"></script>
  <script src="js/screens/flujo/entrando.js"></script>
  <script src="js/screens/flujo/feed.js"></script>
  <script src="js/screens/flujo/pasaste.js"></script>
  <script src="js/screens/flujo/cierre.js"></script>
  <script src="js/screens/pilas/inicio.js"></script>
  <script src="js/screens/pilas/grupo.js"></script>
  <script src="js/screens/pilas/descanso.js"></script>
  <script src="js/screens/pilas/dejarmensaje.js"></script>
  <script src="js/screens/pilas/yo.js"></script>
  <script src="js/components/focusRing.js"></script>
  <script src="js/components/grupo.js"></script>
  <script src="js/components/bottomNav.js"></script>
  <script src="js/screens/onEnter.js"></script>
  <script src="js/sheets/sheet.js"></script>
  <script src="js/sheets/avisoTiempo.js"></script>
  <script src="js/sheets/avisoDescanso.js"></script>
  <script src="js/core/flow.js"></script>
  <script src="js/sheets/checkin.js"></script>
  <script src="js/sheets/salida.js"></script>
  <script src="js/sheets/selector.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
